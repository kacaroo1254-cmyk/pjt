<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDEX02</title>
</head>
<body>
    <!-- 
    img
    이미지 출력태그(나홀로 태그)(속성이 있는태그)
    src 위치
    width 가로너비 (px-픽셀, %-브라우저창에 맞게 적용)
    height 세로높이
    alt 그림이 깨진경우 설명글이 나옴
    현재 경로:./ (생략가능)
    상위 경로:../
    루트 경로:/
    -->
    <img src="./res/img/jm.png" width="300px" alt="한지민  일러스트">
    <br>
    <img src="./res/img/jm.png" width="100px" alt="한지민  일러스트">
    <br>
    <img src="../../jm.png" width="100px" alt="한지민  일러스트">
    <br>
    <img 
    title="네이버배너"
    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREgMvRSkDGfCR9fxOwNJf5ibQQX_xPLMhsQqJrQpIiyA&s=10">
    
    <!-- 
    유튜브 영상 출력 태그
    -->
    <iframe 
    width="560" height="315" 
    src="https://www.youtube.com/embed/oAwzFFEYm38?si=WTTVKzYYJOVzg2YR" 
    title="YouTube video player" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
    referrerpolicy="strict-origin-when-cross-origin" 
    allowfullscreen>
    </iframe>
    <br>
    


</body>
</html>

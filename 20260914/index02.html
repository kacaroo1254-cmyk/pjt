<!DOCTYPE html>

    <style>
        /* 
        css 코드
        border-collapse를 짜부시키겟다
        너비는 500px
        border 1px solid는 실선
        padding 은 표안에데이터가 가장자리로부터 5px의 거리를 가진다
         */
        table{
            border-collapse: collapse;
            width: 500px;
        }
        td{
            border: 1px solid #ccc;
            padding: 5px;
        }
    </style>
</head>

     <table>
